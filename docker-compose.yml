services:
  db:
    image: postgres:16-alpine
    container_name: followup-db
    environment:
      POSTGRES_DB: followup_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d followup_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  followup-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: followup-agent-gpu
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data   # Mount thư mục audio tạm ra ngoài để dễ debug
      - ./models:/app/models # Mount thư mục models chứa file GGUF từ host vào container
    env_file:
      - .env               # Tự động đọc biến môi trường từ file .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # Override DATABASE_URL để trỏ vào container db (thay vì localhost)
      - DATABASE_URL=postgresql://postgres:password@db:5432/followup_agent
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  postgres_data:
